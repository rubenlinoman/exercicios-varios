<div class="row d-flex justify-content-center">
  <div class="col-12">
    <h2 class="text-center">* Square</h2>
    <form [formGroup]="ladosForm" (ngSubmit)="calculateSquare()">
      <mat-form-field class="w-100">
        <mat-label>Nº de Lados</mat-label>
        <input matInput type="number" formControlName="lados">
      </mat-form-field>
      <div>
        <button mat-raised-button type="submit">Enviar</button>
      </div>
    </form>
  </div>
  <div class="col-12 mt-5" align="center" *ngIf="square !== null">
    <p [innerHTML]="square"></p>
  </div>
</div>
